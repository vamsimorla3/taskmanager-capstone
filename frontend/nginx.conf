server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1000;

    # Serve static files, fall back to index.html for React Router
    # (not using a router yet, but this is the standard SPA pattern)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have hashed filenames, so this is safe)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
