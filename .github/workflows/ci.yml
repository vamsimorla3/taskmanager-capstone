name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.project }}
        run: npm run lint

  test:
    name: Test & Coverage (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: taskadmin
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migration
        working-directory: backend
        run: PGPASSWORD=devpassword123 psql -h localhost -U taskadmin -d taskmanager -f migrations/001_create_tasks_table.sql

      - name: Run tests with coverage
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: taskadmin
          DB_PASSWORD: devpassword123
          DB_NAME: taskmanager
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage/

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v5.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy fs scan results
        uses: github/codeql-action/upload-sarif@v3 # pinned to major version only; full commit SHA not yet verified, see note in SECRETS.md
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

  trivy-config:
    name: Trivy Dockerfile Config Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy config scan results
        uses: github/codeql-action/upload-sarif@v3 # pinned to major version only; full commit SHA not yet verified, see note in SECRETS.md
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, trivy-fs, trivy-config]
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # pinned to major version only; full commit SHA not yet verified

      - name: Build image
        uses: docker/build-push-action@v6 # pinned to major version only; full commit SHA not yet verified
        with:
          context: ${{ matrix.project }}
          push: false
          tags: taskmanager-${{ matrix.project }}:${{ github.sha }}
          build-args: |
            ${{ matrix.project == 'frontend' && 'VITE_API_URL=http://localhost:3000' || '' }}

      # ECR push is intentionally not implemented yet — the ECR repository
      # and IAM/OIDC role are created in Phase 4 (Terraform). Once that
      # infrastructure exists, this job will be extended with:
      #   - configure-aws-credentials (OIDC, no long-lived keys)
      #   - docker/login-action against ECR
      #   - push: true, tags including the ECR repository URI
      - name: ECR push (pending Phase 4 infrastructure)
        run: |
          echo "Skipping ECR push — ECR repository and OIDC role are provisioned in Phase 4."
          echo "Image built successfully and tagged as taskmanager-${{ matrix.project }}:${{ github.sha }}"
