apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: taskmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: taskmanager-capstone/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: taskmanager-capstone/db-credentials
        property: password
    - secretKey: host
      remoteRef:
        key: taskmanager-capstone/db-credentials
        property: host
    - secretKey: dbname
      remoteRef:
        key: taskmanager-capstone/db-credentials
        property: dbname
